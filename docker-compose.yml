services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grove
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: familygrove
    ports:
      - "5432:5432"
    volumes:
      - grove-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grove -d familygrove"]
      interval: 5s
      retries: 10
volumes:
  grove-postgres:
